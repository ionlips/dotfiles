os:
  # Inside Neovim's terminal (`$NVIM` is set), quit lazygit and open files in
  # that Neovim rather than a nested one. Elsewhere, open them in a new Neovim.
  # The preset only suspends lazygit outside Neovim, but opens files in a new
  # tab, hence the templates using `--remote` instead of `--remote-tab`.
  editPreset: nvim-remote
  edit: >-
    [ -z "$NVIM" ] && (nvim -- {{filename}}) ||
    (nvim --server "$NVIM" --remote-send "q" &&
    nvim --server "$NVIM" --remote {{filename}})
  editAtLine: >-
    [ -z "$NVIM" ] && (nvim +{{line}} -- {{filename}}) ||
    (nvim --server "$NVIM" --remote-send "q" &&
    nvim --server "$NVIM" --remote {{filename}} &&
    nvim --server "$NVIM" --remote-send ":{{line}}<CR>")
  openDirInEditor: >-
    [ -z "$NVIM" ] && (nvim -- {{dir}}) ||
    (nvim --server "$NVIM" --remote-send "q" &&
    nvim --server "$NVIM" --remote {{dir}})
