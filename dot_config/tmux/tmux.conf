bind C-Space send-prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind-key s choose-tree -NsZ
bind-key w choose-tree -NwZ
set -g base-index 1
set -g mouse on
set -g prefix C-Space
set -g set-clipboard on
setw -g mode-keys vi
unbind -T copy-mode-vi MouseDragEnd1Pane
unbind C-b

# Taken from <https://github.com/if-not-nil/dots/blob/main/.tmux.conf>.
set -g message-command-style reverse
set -g message-style "fg=default,bg=default"
set -g status-interval 5
set -g status-justify absolute-centre
set -g status-left ""
set -g status-position top
set -g status-style "fg=default bg=default"
setw -g window-status-current-format "#I:#W"
setw -g window-status-current-style "fg=green bold bg=default"
setw -g window-status-format "#I:#W"
setw -g window-status-style "fg=default"
