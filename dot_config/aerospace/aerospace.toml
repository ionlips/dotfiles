config-version = 2
default-root-container-layout = "tiles"
default-root-container-orientation = "auto"
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
on-focused-monitor-changed = ["move-mouse monitor-lazy-center"]
persistent-workspaces = ["1", "4", "5", "6", "7", "8", "9"]
start-at-login = true

[gaps]
inner.horizontal = 5
inner.vertical = 5
outer.bottom = 5
outer.left = 5
outer.right = 5
outer.top = 5

[key-mapping]
preset = "qwerty"

[mode.main.binding]
alt-1 = "workspace 1"
alt-4 = "workspace 4"
alt-5 = "workspace 5"
alt-6 = "workspace 6"
alt-7 = "workspace 7"
alt-8 = "workspace 8"
alt-9 = "workspace 9"
alt-a = "workspace A"
alt-b = "workspace B"
alt-f = "workspace F"
alt-m = "workspace M"
alt-p = "workspace P"
alt-t = "workspace T"
alt-v = "workspace V"

alt-equal = "resize smart +50"
alt-minus = "resize smart -50"

alt-h = "focus left"
alt-j = "focus down"
alt-k = "focus up"
alt-l = "focus right"

alt-shift-1 = "move-node-to-workspace 1"
alt-shift-4 = "move-node-to-workspace 4"
alt-shift-5 = "move-node-to-workspace 5"
alt-shift-6 = "move-node-to-workspace 6"
alt-shift-7 = "move-node-to-workspace 7"
alt-shift-8 = "move-node-to-workspace 8"
alt-shift-9 = "move-node-to-workspace 9"
alt-shift-b = "move-node-to-workspace B"
alt-shift-f = "move-node-to-workspace F"
alt-shift-t = "move-node-to-workspace T"

alt-shift-h = "move left"
alt-shift-j = "move down"
alt-shift-k = "move up"
alt-shift-l = "move right"

alt-shift-semicolon = "mode service"
alt-shift-tab = "move-workspace-to-monitor --wrap-around next"
alt-shift-z = "fullscreen"

[mode.service.binding]
esc = ["reload-config", "mode main"]
f = ["layout floating tiling", "mode main"]

[[on-window-detected]]
if.app-id = "ch.protonvpn.mac"
run = ["move-node-to-workspace V", "workspace V"]

[[on-window-detected]]
if.app-id = "com.apple.finder"
run = ["move-node-to-workspace F", "workspace F"]

[[on-window-detected]]
if.app-id = "com.mitchellh.ghostty"
run = ["move-node-to-workspace T", "workspace T"]

[[on-window-detected]]
if.app-id = "com.spotify.client"
run = ["move-node-to-workspace M", "workspace M"]

[[on-window-detected]]
if.app-id = "me.proton.pass.electron"
run = ["move-node-to-workspace P", "workspace P"]

[[on-window-detected]]
if.app-id = "net.ankiweb.launcher"
run = ["move-node-to-workspace A", "workspace A"]

[[on-window-detected]]
if.app-id = "org.mozilla.firefox"
run = ["move-node-to-workspace B", "workspace B"]

[workspace-to-monitor-force-assignment]
1 = "DELL S3422DW"
4 = "DELL S3422DW"
5 = "DELL S3422DW"
6 = "DELL S3422DW"
7 = "DELL S3422DW"
8 = "DELL S3422DW"
9 = "DELL S3422DW"
A = "DELL S3422DW"
B = "DELL S3422DW"
F = "DELL S3422DW"
M = "DELL S3422DW"
P = "DELL S3422DW"
T = "DELL S3422DW"
